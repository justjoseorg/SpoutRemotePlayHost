name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Compute next version
        id: ver
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case ",$LABELS," in
            *,release:major,*) major=$((major+1)); minor=0; patch=0 ;;
            *,release:patch,*) patch=$((patch+1)) ;;
            *) minor=$((minor+1)); patch=0 ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir dist
          for target in windows/amd64/.exe linux/amd64/; do
            IFS=/ read -r os arch ext <<< "$target"
            name="spigot-companion-v${VERSION}-${os}-${arch}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}${ext}" ./cmd/spigot-companion
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "v${VERSION}" \
            --notes "${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})"
