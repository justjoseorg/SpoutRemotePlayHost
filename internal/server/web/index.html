<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpoutRemotePlayHost</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .75rem 0 .25rem; }
  input[type=number] { width: 100%; padding: .4rem; box-sizing: border-box; }
  button { margin: 1rem .5rem 0 0; padding: .5rem 1rem; }
  .card { border: 1px solid #8884; border-radius: .5rem; padding: .75rem; margin: .5rem 0; }
  .card input { width: 6rem; font-size: 1.4rem; letter-spacing: .3rem; text-align: center; }
  #msg { margin-top: 1rem; min-height: 1.5rem; }
</style>
<h1>SpoutRemotePlayHost</h1>
<section id="pairing" hidden>
  <h2>Pairing request</h2>
  <div id="pending"></div>
</section>
<p>Virtual monitor: <strong id="state">…</strong> <small id="ver"></small></p>
<form id="f">
  <label>Width <input type="number" name="width"></label>
  <label>Height <input type="number" name="height"></label>
  <label>Refresh (Hz) <input type="number" name="refreshHz"></label>
  <label>Codec preference (hint only; Steam picks the real codec)
    <select name="codec"><option value="auto">Auto</option><option value="h264">H.264</option><option value="hevc">HEVC</option><option value="av1">AV1</option></select></label>
  <label><input type="checkbox" name="autoCreate"> Create automatically when a Remote Play session starts</label>
  <button type="submit">Save</button>
</form>
<button id="create">Create monitor</button><button id="destroy">Destroy monitor</button>
<h2>Paired devices</h2>
<div id="clients"></div>
<div id="msg"></div>
<script>
const $ = (s) => document.querySelector(s);
const msg = (t) => ($("#msg").textContent = t);
async function api(method, path, body) {
  const r = await fetch(path, { method, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function load() {
  const c = await api("GET", "/api/config");
  for (const k of ["width", "height", "refreshHz"]) $("#f")[k].value = c[k];
  $("#f").autoCreate.checked = c.autoCreate;
  $("#f").codec.value = c.codec;
  const s = await api("GET", "/api/status");
  $("#state").textContent = s.monitorActive ? "active" : "inactive";
  $("#ver").textContent = "v" + s.version;
}
$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    await api("PUT", "/api/config", {
      width: +f.width.value, height: +f.height.value,
      refreshHz: +f.refreshHz.value, codec: f.codec.value, autoCreate: f.autoCreate.checked,
    });
    msg("Saved");
  } catch (err) { msg(err.message); }
};
for (const a of ["create", "destroy"])
  $("#" + a).onclick = async () => {
    try { await api("POST", "/api/monitor/" + a); msg("OK"); } catch (err) { msg(err.message); }
    load();
  };

function el(tag, text, props) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  return Object.assign(e, props);
}
async function refreshPairing() {
  try {
    const pending = await api("GET", "/api/pair/pending");
    $("#pairing").hidden = pending.length === 0;
    const box = $("#pending");
    if (!box.querySelector("input:focus")) {
      box.replaceChildren(...pending.map((p) => {
        const card = el("div", "", { className: "card" });
        const pin = el("input", "", { inputMode: "numeric", maxLength: 4, placeholder: "PIN" });
        const ok = el("button", "Pair", { onclick: async () => {
          try { await api("POST", "/api/pair/confirm", { id: p.id, pin: pin.value }); msg("Paired " + p.name); }
          catch (err) { msg(err.message); }
          refreshPairing(); refreshClients();
        } });
        const no = el("button", "Deny", { onclick: async () => { await api("DELETE", "/api/pair/pending/" + p.id); refreshPairing(); } });
        card.append(el("p", p.name + " wants to pair. Enter the 4-digit PIN shown on that device."), pin, ok, no);
        return card;
      }));
    }
  } catch (e) {}
}
async function refreshClients() {
  const list = await api("GET", "/api/clients");
  $("#clients").replaceChildren(...(list.length ? list : [null]).map((c) => {
    if (!c) return el("p", "None yet.");
    const row = el("div", "", { className: "card" });
    row.append(el("strong", c.name), el("span", "  " + new Date(c.added).toLocaleDateString() + "  "),
      el("button", "Revoke", { onclick: async () => { await api("DELETE", "/api/clients/" + c.id); refreshClients(); } }));
    return row;
  }));
}
load();
refreshClients();
refreshPairing();
setInterval(refreshPairing, 2000);
</script>
